# Blueprint de Render: servicio web (Docker) + PostgreSQL gestionado.
# Render > New > Blueprint > selecciona este repositorio. Te pedirá GEMINI_API_KEY.
services:
  - type: web
    name: intelli-stock
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intelli-stock-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite
      - key: LLM_MAX_TOOL_CALLS
        value: "6"
      - key: LLM_TIMEOUT_MS
        value: "45000"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "8192"
      - key: LLM_RATE_PER_MIN
        value: "10"
      - key: LLM_DAILY_CAP
        value: "300"
      - key: LLM_DAILY_TOKEN_CAP
        value: "1000000"
      - key: APP_TZ
        value: America/Lima

databases:
  - name: intelli-stock-db
    plan: free
    databaseName: intelli_stock
    user: intelli_stock
    postgresMajorVersion: "17"
