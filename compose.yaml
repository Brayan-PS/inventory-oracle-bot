services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-intelli_stock}
      PGUSER: ${POSTGRES_USER:-intelli_stock}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash,gemini-3.1-flash-lite}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-}
      LLM_MAX_TOOL_CALLS: ${LLM_MAX_TOOL_CALLS:-6}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-45000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8192}
      LLM_RATE_PER_MIN: ${LLM_RATE_PER_MIN:-10}
      LLM_DAILY_CAP: ${LLM_DAILY_CAP:-300}
      LLM_DAILY_TOKEN_CAP: ${LLM_DAILY_TOKEN_CAP:-1000000}
      LLM_DAILY_CAP_PER_USER: ${LLM_DAILY_CAP_PER_USER:-100}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      # En Docker local no hay proxy delante: no se confía en X-Forwarded-For.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      APP_TZ: ${APP_TZ:-America/Lima}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-intelli_stock}
      PGUSER: ${POSTGRES_USER:-intelli_stock}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      DEMO_USER: ${DEMO_USER:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_NOMBRE: ${DEMO_NOMBRE:-Docente evaluador}
      DEMO_ROL: ${DEMO_ROL:-admin}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intelli_stock}
      POSTGRES_USER: ${POSTGRES_USER:-intelli_stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
