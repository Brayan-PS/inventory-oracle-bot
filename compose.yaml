services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-intelli_stock}
      PGUSER: ${POSTGRES_USER:-intelli_stock}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-intelli_stock}
      PGUSER: ${POSTGRES_USER:-intelli_stock}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intelli_stock}
      POSTGRES_USER: ${POSTGRES_USER:-intelli_stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
